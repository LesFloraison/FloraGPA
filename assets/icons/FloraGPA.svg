  <!-- Icon version: scale the central mark 1.3x around canvas center -->
  <g transform="translate(512 512) scale(1.3) translate(-512 -512)">
    <!-- Standardized outer shape: top-left & bottom-right R256; top-right & bottom-left R12 -->
    <path fill="#FFFFFF"
          d="M 488 240
             H 780
             A 12 12 0 0 1 792 252
             V 528
             A 256 256 0 0 1 536 784
             H 244
