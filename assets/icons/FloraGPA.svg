          stroke="#0069FE"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M 280 604
             H 360
             C 396 604 416 504 452 504
             C 480 504 486 596 512 596
             C 544 596 568 400 600 400
             C 632 400 632 532 664 532
